<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovePro - Interactive Moving Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col justify-between">
            <div>
                <div class="p-5 flex items-center space-x-3 border-b border-slate-800">
                    <i class="fa-solid fa-truck-fast text-2xl text-emerald-400"></i>
                    <span class="text-xl font-bold text-white">MovePro CRM</span>
                </div>
                <nav class="p-4 space-y-2">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center space-x-3 p-3 rounded-lg bg-emerald-600 text-white font-medium transition">
                        <i class="fa-solid fa-house"></i>
                        <span>Dashboard</span>
                    </button>
                    <button onclick="switchTab('requests')" id="nav-requests" class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-slate-800 text-slate-300 transition">
                        <i class="fa-solid fa-clipboard-list"></i>
                        <span>Moving Requests</span>
                    </button>
                    <button onclick="switchTab('reports')" id="nav-reports" class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-slate-800 text-slate-300 transition">
                        <i class="fa-solid fa-chart-pie"></i>
                        <span>Monthly Reports</span>
                    </button>
                </nav>
            </div>
            <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
                Interactive Dashboard v2.3
            </div>
        </aside>

        <!-- Main Area -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            
            <!-- Header -->
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-6">
                <h1 id="pageTitle" class="text-xl font-bold text-slate-800">Moving Requests Management</h1>
                <button onclick="openModalForAdd()" id="newReqBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium shadow transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>New Move Request</span>
                </button>
            </header>

            <!-- Content Area -->
            <main class="p-6 space-y-6">
                
                <!-- Section 1: Requests View -->
                <div id="section-requests" class="space-y-6">
                    <!-- Search & Filters -->
                    <div class="bg-white p-4 rounded-xl shadow-sm flex flex-col md:flex-row gap-4 items-center justify-between">
                        <div class="relative w-full md:w-96">
                            <i class="fa-solid fa-search absolute left-3 top-3.5 text-slate-400"></i>
                            <input type="text" id="searchInput" oninput="renderRequests()" placeholder="Search by client or title..." class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="setStatusFilter('All')" id="btn-All" class="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-medium">All</button>
                            <button onclick="setStatusFilter('Pending Survey')" id="btn-Pending" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-medium">Pending</button>
                            <button onclick="setStatusFilter('Completed')" id="btn-Completed" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-medium">Completed</button>
                        </div>
                    </div>

                    <!-- Requests Grid -->
                    <div id="requestsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </div>

                <!-- Section 2: Monthly Reports View -->
                <div id="section-reports" class="hidden space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-2">
                            <p class="text-xs text-slate-400 uppercase font-semibold">Total Requests</p>
                            <h3 id="repTotal" class="text-3xl font-bold text-slate-800">0</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-2">
                            <p class="text-xs text-emerald-500 uppercase font-semibold">Completed Orders</p>
                            <h3 id="repCompleted" class="text-3xl font-bold text-emerald-600">0</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-2">
                            <p class="text-xs text-amber-500 uppercase font-semibold">Pending Orders</p>
                            <h3 id="repPending" class="text-3xl font-bold text-amber-600">0</h3>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 space-y-4">
                        <h3 class="font-bold text-slate-800 text-lg">Monthly Performance Summary</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="border-b text-slate-400 font-semibold text-xs uppercase">
                                        <th class="py-3 px-4">Month</th>
                                        <th class="py-3 px-4">Total Moves</th>
                                        <th class="py-3 px-4">Completed</th>
                                        <th class="py-3 px-4">Performance Rate</th>
                                    </tr>
                                </thead>
                                <tbody id="reportTableBody" class="text-slate-600">
                                    <!-- Dynamic rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </main>
        </div>

    </div>

    <!-- Modal Form (Add / Edit) -->
    <div id="requestModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-lg p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modalTitleText" class="text-lg font-bold text-slate-800">Add New Move Request</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
            </div>
            <form onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="editingId">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Move Title</label>
                    <input type="text" id="modalTitle" required placeholder="e.g., Villa Relocation" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Client Name</label>
                    <input type="text" id="modalClient" required placeholder="e.g., Ahmed Al-Balushi" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Date</label>
                        <input type="date" id="modalDate" class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Status</label>
                        <select id="modalStatus" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                            <option value="Pending Survey">Pending Survey</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end space-x-3 pt-3 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-sm text-slate-600">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium">Save Request</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Interactive Script -->
    <script>
        let requests = [
            { id: 'REQ-0142', title: 'Villa Relocation (Al Mouj)', client: 'Ahmed Al-Balushi', date: '2026-06-18', status: 'Pending Survey', badge: 'bg-amber-50 text-amber-600' },
            { id: 'REQ-0141', title: 'Office Move (CBD to Ghubrah)', client: 'Tech Solutions', date: '2026-06-12', status: 'Completed', badge: 'bg-emerald-50 text-emerald-600' },
            { id: 'REQ-0140', title: 'Apartment Packing & Moving', client: 'Sarah Smith', date: '2026-10-13', status: 'Completed', badge: 'bg-emerald-50 text-emerald-600' }
        ];
        let currentFilter = 'All';

        function renderRequests() {
            const grid = document.getElementById('requestsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = requests.filter(r => {
                const matchesSearch = r.title.toLowerCase().includes(search) || r.client.toLowerCase().includes(search);
                const matchesFilter = currentFilter === 'All' || r.status === currentFilter;
                return matchesSearch && matchesFilter;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="text-slate-500 col-span-full text-center py-10">No requests found.</p>`;
                return;
            }

            filtered.forEach(req => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5 space-y-4 hover:shadow-md transition">
                        <div class="flex justify-between items-start">
                            <span class="px-3 py-1 text-xs font-semibold rounded-full ${req.badge}">${req.status}</span>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs text-slate-400 font-mono">${req.id}</span>
                                <button onclick="openModalForEdit('${req.id}')" class="text-blue-400 hover:text-blue-600 text-xs" title="Edit">✏️</button>
                                <button onclick="deleteRequest('${req.id}')" class="text-red-400 hover:text-red-600 text-xs" title="Delete">🗑️</button>
                            </div>
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-800 text-lg">${req.title}</h3>
                            <p class="text-sm text-slate-500 mt-1">👤 Client: ${req.client}</p>
                        </div>
                        <div class="border-t border-slate-100 pt-3 text-xs text-slate-600">
                            <p>📅 Date: ${req.date}</p>
                        </div>
                    </div>
                `;
            });
        }

        function renderReports() {
            document.getElementById('repTotal').innerText = requests.length;
            const completedCount = requests.filter(r => r.status === 'Completed').length;
            const pendingCount = requests.filter(r => r.status === 'Pending Survey').length;
            
            document.getElementById('repCompleted').innerText = completedCount;
            document.getElementById('repPending').innerText = pendingCount;

            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = `
                <tr class="border-b">
                    <td class="py-3 px-4 font-medium">October 2026</td>
                    <td class="py-3 px-4">${requests.length}</td>
                    <td class="py-3 px-4">${completedCount}</td>
                    <td class="py-3 px-4 text-emerald-600 font-semibold">${Math.round((completedCount / (requests.length || 1)) * 100)}%</td>
                </tr>
            `;
        }

        function switchTab(tab) {
            const navDashboard = document.getElementById('nav-dashboard');
            const navRequests = document.getElementById('nav-requests');
            const navReports = document.getElementById('nav-reports');
            const secRequests = document.getElementById('section-requests');
            const secReports = document.getElementById('section-reports');
            const title = document.getElementById('pageTitle');
            const newBtn = document.getElementById('newReqBtn');

            // Reset all
            navDashboard.className = 'w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-slate-800 text-slate-300 transition';
            navRequests.className = 'w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-slate-800 text-slate-300 transition';
            navReports.className = 'w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-slate-800 text-slate-300 transition';
            secRequests.classList.add('hidden');
            secReports.classList.add('hidden');
            newBtn.style.display = 'flex';

            if (tab === 'dashboard' || tab === 'requests') {
                if(tab === 'dashboard') navDashboard.className = 'w-full flex items-center space-x-3 p-3 rounded-lg bg-emerald-600 text-white font-medium transition';
                if(tab === 'requests') navRequests.className = 'w-full flex items-center space-x-3 p-3 rounded-lg bg-emerald-600 text-white font-medium transition';
                secRequests.classList.remove('hidden');
                title.innerText = tab === 'dashboard' ? 'Dashboard Overview' : 'Moving Requests Management';
                setStatusFilter('All');
            } else if (tab === 'reports') {
                navReports.className = 'w-full flex items-center space-x-3 p-3 rounded-lg bg-emerald-600 text-white font-medium transition';
                secReports.classList.remove('hidden');
                title.innerText = 'Monthly Reports & Analytics';
                newBtn.style.display = 'none';
                renderReports();
            }
        }

        function openModalForAdd() {
            document.getElementById('editingId').value = '';
            document.getElementById('modalTitleText').innerText = 'Add New Move Request';
            document.getElementById('modalTitle').value = '';
            document.getElementById('modalClient').value = '';
            document.getElementById('modalDate').value = '';
            document.getElementById('modalStatus').value = 'Pending Survey';
            document.getElementById('requestModal').style.display = 'flex';
        }

        function openModalForEdit(id) {
            const req = requests.find(r => r.id === id);
            if (!req) return;

            document.getElementById('editingId').value = req.id;
            document.getElementById('modalTitleText').innerText = 'Edit Move Request (' + req.id + ')';
            document.getElementById('modalTitle').value = req.title;
            document.getElementById('modalClient').value = req.client;
            document.getElementById('modalDate').value = req.date;
            document.getElementById('modalStatus').value = req.status;
            document.getElementById('requestModal').style.display = 'flex';
        }

        function closeModal() { 
            document.getElementById('requestModal').style.display = 'none'; 
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editingId = document.getElementById('editingId').value;
            const title = document.getElementById('modalTitle').value;
            const client = document.getElementById('modalClient').value;
            const date = document.getElementById('modalDate').value || '2026-10-13';
            const status = document.getElementById('modalStatus').value;

            let badge = 'bg-amber-50 text-amber-600';
            if (status === 'Completed') badge = 'bg-emerald-50 text-emerald-600';
            if (status === 'In Progress') badge = 'bg-blue-50 text-blue-600';

            if (editingId) {
                requests = requests.map(r => r.id === editingId ? { ...r, title, client, date, status, badge } : r);
            } else {
                requests.unshift({
                    id: 'REQ-' + Math.floor(Math.random() * 900 + 100),
                    title, client, date, status, badge
                });
            }

            closeModal();
            renderRequests();
            renderReports();
        }

        function deleteRequest(id) {
            requests = requests.filter(r => r.id !== id);
            renderRequests();
            renderReports();
        }

        function setStatusFilter(status) {
            currentFilter = status;
            renderRequests();
        }

        renderRequests();
    </script>
</body>
</html>
